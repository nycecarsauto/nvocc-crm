<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NVOCC Freight CRM</title>
<style>
  :root{--bg:#0f172a;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#0d6efd;--accent:#0891b2;--warn:#b45309;--chip:#f1f5f9;--shadow:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06);}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#f4f6fb}
  header{background:var(--bg);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
  header .logo{font-weight:700;letter-spacing:.3px;font-size:18px;display:flex;align-items:center;gap:9px}
  header .logo .badge{background:var(--brand);border-radius:7px;padding:3px 8px;font-size:12px}
  nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
  nav button{background:transparent;color:#cbd5e1;border:0;padding:7px 11px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500}
  nav button:hover{background:#1e293b;color:#fff} nav button.active{background:var(--brand);color:#fff}
  .spacer{flex:1}
  .whoami{color:#cbd5e1;font-size:13px;display:flex;align-items:center;gap:10px}
  .whoami .role{background:#1e293b;padding:2px 8px;border-radius:6px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .whoami button{background:#1e293b;color:#cbd5e1;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  .whoami button:hover{color:#fff}
  main{max-width:1120px;margin:22px auto;padding:0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
  h2{margin:2px 0 4px;font-size:20px} h3{margin:0 0 12px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr 1fr 1fr}
  @media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--brand)}
  textarea{resize:vertical;min-height:64px}
  .btn{border:0;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--brand);color:#fff}.btn.ghost{background:var(--chip);color:var(--ink)}.btn.sm{padding:6px 11px;font-size:13px}.btn.danger{background:#fee2e2;color:#b91c1c}
  .btn:hover{filter:brightness(.97)}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .items-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden}.items-scroll{max-height:360px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{position:sticky;top:0;background:#f8fafc;text-align:left;padding:10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--line);z-index:2}
  tbody td{padding:7px 8px;border-bottom:1px solid #eef2f7;vertical-align:middle} tbody tr:hover{background:#fafcff}
  td input,td select{padding:7px 8px;font-size:13px}.cell-sm{width:74px}.cell-xs{width:58px}
  .type-barrel{border-left:3px solid var(--warn)}.type-box{border-left:3px solid var(--brand)}.type-other{border-left:3px solid var(--accent)}
  .muted{color:var(--muted)}
  /* waybill */
  .waybill-head{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;border-radius:14px;padding:16px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
  .wh-title{font-size:22px;font-weight:800;letter-spacing:3px}.wh-sub{font-size:12px;opacity:.75;letter-spacing:.5px}
  .wh-meta{display:flex;gap:26px;flex-wrap:wrap}.wh-meta>div{display:flex;flex-direction:column}
  .wh-meta span{font-size:10px;text-transform:uppercase;letter-spacing:.6px;opacity:.7}.wh-meta b{font-size:15px}
  .wb-box{padding:0;overflow:hidden}.wb-box h3{display:flex;align-items:center;gap:10px;margin:0;padding:12px 18px;color:#fff;font-size:15px}
  .wb-box>*:not(h3){margin-left:18px;margin-right:18px}.wb-box>*:nth-child(2){margin-top:16px}.wb-box>*:last-child{margin-bottom:18px}
  .wb-from h3{background:var(--warn)}.wb-to h3{background:var(--brand)}
  .wb-tag{display:inline-flex;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25);align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .wb-when{margin-top:6px;padding-top:12px;border-top:1px dashed var(--line)}
  @media(max-width:720px){.waybill-cols{grid-template-columns:1fr}.wh-meta{gap:16px}}
  /* office waybill input form */
  .wb-office{padding:16px 18px}
  .wb-title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .wb-big{display:flex;align-items:center;gap:10px}
  .wb-big-lbl{font-weight:800;letter-spacing:2px;color:var(--muted);font-size:13px}
  .wb-big input{font-size:20px;font-weight:800;color:var(--brand);border:none;border-bottom:2px solid var(--line);border-radius:0;width:190px;padding:2px 4px}
  .wb-money{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .wb-money-cell{background:var(--chip);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
  .wb-money-cell span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .wb-amt{font-size:18px}.wb-profit{color:#059669}
  .wb-money-cell input{border:none;background:transparent;font-size:18px;font-weight:700;padding:0;color:var(--warn)}
  .wb-grid{display:flex;flex-direction:column;gap:9px}
  .wb-head-row,.wb-row{display:grid;grid-template-columns:1fr 160px 1fr;gap:10px;align-items:center}
  .wb-side{font-weight:800;letter-spacing:1px;text-align:center;padding:7px;border-radius:8px;color:#fff}
  .wb-from-h{background:var(--warn)}.wb-to-h{background:var(--brand)}
  .wb-lbl{text-align:center;font-size:12px;color:var(--muted);font-weight:600}
  .wb-cell{min-width:0}
  @media(max-width:720px){.wb-head-row,.wb-row{grid-template-columns:1fr;gap:4px}.wb-lbl{text-align:left;font-weight:700;color:var(--ink);margin-top:8px}.wb-money{grid-template-columns:1fr}}
  /* house bill / declaration print docs */
  .hb{padding:22px 26px}
  .hb-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:12px}
  .hb-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .hb-box{border:1px solid #000;padding:8px 10px;min-height:92px}
  .hb-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;border-bottom:1px solid #ccc;margin-bottom:4px;padding-bottom:2px}
  .hb-party div,.hb-box div{font-size:12px;line-height:1.4}
  .hb-meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12px;margin-bottom:12px}
  .hb-note{font-size:12px;margin:10px 0;padding:8px;background:#f8f8f8;border:1px solid #ddd}
  /* reports */
  .rep-wrap{display:flex;gap:16px;align-items:flex-start}
  .rep-menu{width:210px;flex:none}
  @media(max-width:720px){.rep-wrap{flex-direction:column}.rep-menu{width:100%}.hb-grid{grid-template-columns:1fr}}
  .totchip{display:inline-flex;flex-direction:column;background:var(--chip);border-radius:11px;padding:10px 16px;min-width:120px}
  .totchip b{font-size:20px}.totchip span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .totals{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill.Draft{background:#f1f5f9;color:#475569}.pill.Booked{background:#dbeafe;color:#1d4ed8}.pill.Shipped{background:#dcfce7;color:#15803d}.pill.Delivered{background:#e9d5ff;color:#7e22ce}
  .list-table td,.list-table th{padding:11px 12px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .flash{position:fixed;bottom:22px;right:22px;background:#111827;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.25s;z-index:60}
  .flash.show{opacity:1;transform:none}.flash.err{background:#b91c1c}
  .hint{font-size:11.5px;color:var(--muted);margin-top:3px}.divider{height:1px;background:var(--line);margin:18px 0}.barreldim{opacity:.45}
  /* auth screen */
  .authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e3a8a);padding:20px}
  .authcard{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:420px;padding:30px}
  .authcard .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:4px}
  .lp-back{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:0;margin-bottom:10px}
  .lp-back:hover{color:var(--ink)}
  /* landing / front page */
  .lp{min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff}
  .lp-top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;max-width:1080px;margin:0 auto}
  .lp-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
  .lp-brand .badge{background:var(--brand);color:#fff;border-radius:8px;padding:4px 9px;font-size:13px}
  .lp-signin{background:rgba(255,255,255,.14);color:#fff;border:0;padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:600}
  .lp-signin:hover{background:rgba(255,255,255,.24)}
  .lp-hero{max-width:820px;margin:0 auto;text-align:center;padding:54px 20px 34px}
  .lp-hero h1{font-size:42px;line-height:1.08;margin:0 0 14px;font-weight:800}
  .lp-sub{font-size:18px;color:#cbd5e1;margin:0 0 30px}
  .lp-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .lp-big{font-size:17px;padding:15px 28px;border-radius:12px}
  .lp-ghostbig{font-size:17px;padding:15px 28px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;border:0;cursor:pointer;font-weight:600}
  .lp-ghostbig:hover{background:rgba(255,255,255,.22)}
  .lp-note{color:#94a3b8;font-size:13px;margin-top:18px}
  .lp-steps{max-width:1000px;margin:20px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 20px}
  @media(max-width:720px){.lp-steps{grid-template-columns:1fr}.lp-hero h1{font-size:30px}}
  .lp-step{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:20px}
  .lp-step .n{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .lp-step h3{margin:0 0 6px;font-size:16px;color:#fff;text-transform:none;letter-spacing:0}
  .lp-step p{margin:0;color:#cbd5e1;font-size:14px}
  .lp-foot{max-width:1000px;margin:26px auto;padding:20px;text-align:center;color:#94a3b8;font-size:14px;border-top:1px solid rgba(255,255,255,.12)}
  .authcard .brand .badge{background:var(--brand);color:#fff;border-radius:8px;padding:4px 9px;font-size:13px}
  .tabs{display:flex;gap:6px;margin:18px 0}.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
  .tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* labels / print */
  .label-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .labels-area{display:flex;flex-wrap:wrap;gap:10px}
  .label{width:4in;height:6in;border:1px dashed #cbd5e1;border-radius:8px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;background:#fff;page-break-inside:avoid;break-inside:avoid}
  .label .l-top{font-size:13px}.label .l-co{font-size:22px;font-weight:800;line-height:1.1;margin:6px 0}
  .label .l-meta{font-size:12px;color:#334155}.label .l-bc{text-align:center}.label .l-bc svg{max-width:100%;height:auto}
  .label .l-piece{font-weight:700;font-size:14px}
  body.print-a4 .label{width:3.5in;height:2.4in}
  /* invoice */
  .inv-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .invoice{background:#fff;color:#000;max-width:8.2in;margin:0 auto;border:2px solid #000;padding:14px 16px;font-family:Georgia,'Times New Roman',serif}
  .inv-head{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;gap:12px}
  .inv-co-name{font-size:22px;font-weight:800;letter-spacing:.5px}
  .inv-co-tag{font-size:11px;font-style:italic}
  .inv-co-agent{font-size:11px;font-weight:700}
  .inv-co-addr{font-size:11px}
  .inv-meta{text-align:right;white-space:nowrap}
  .inv-title{display:inline-block;background:#000;color:#fff;font-weight:800;padding:2px 10px;letter-spacing:1px}
  .inv-num{color:#c00;font-size:22px;font-weight:800;margin-top:4px}
  .inv-date{font-size:12px;margin-top:6px}
  .inv-parties{display:flex;border:1px solid #000;border-top:0}
  .inv-box{flex:1;padding:6px 8px;min-height:92px;font-size:12px}
  .inv-box+.inv-box{border-left:1px solid #000}
  .inv-box-h{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid #000;margin-bottom:4px}
  .inv-box .nm{font-weight:700;font-size:13px;text-transform:uppercase}
  .inv-table{width:100%;border-collapse:collapse;font-size:11px}
  .inv-table th,.inv-table td{border:1px solid #000;padding:3px 5px;vertical-align:top}
  .inv-table th{font-size:9px;text-transform:uppercase;text-align:left;background:#fff}
  .inv-table td.num{text-align:right}
  .inv-decl{display:flex;border:1px solid #000;border-top:0;font-size:11px}
  .inv-decl>div{padding:6px 8px}
  .inv-decl .d1,.inv-decl .d2,.inv-decl .d3{flex:1;border-right:1px solid #000}
  .inv-decl .d4{width:170px}
  .inv-total{font-size:22px;font-weight:800}
  .inv-legal{font-size:8.5px;margin-top:8px;text-transform:uppercase;font-weight:700;line-height:1.3}
  .inv-terms{font-size:14px;font-weight:800;text-align:center;margin:8px 0}
  .inv-sign{display:flex;gap:20px;align-items:flex-end;font-size:12px;border-top:1px solid #000;padding-top:8px}
  .inv-fine{font-size:7.5px;margin-top:8px;line-height:1.35}
  .inv-foot{display:flex;gap:24px;align-items:flex-end;font-size:11px;margin-top:10px}
  .inv-foot .ln{flex:1;border-bottom:1px solid #000;min-width:80px;height:14px}
  @media print{
    header,.label-toolbar,.inv-toolbar,.flash{display:none!important}
    main{margin:0;max-width:none;padding:0}
    .labels-area{gap:0}
    .label{border:none;border-radius:0;margin:0}
    .invoice{border:2px solid #000;margin:0}
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="flash" id="flash"></div>
<style id="pagestyle"></style>
<script src="barcode.js"></script>
<script>
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},kids=[])=>{const n=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==='class')n.className=v;else if(k==='html')n.innerHTML=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else if(v!=null)n.setAttribute(k,v);}for(const c of [].concat(kids))if(c!=null)n.append(c.nodeType?c:document.createTextNode(c));return n;};
const api=async(url,opts={})=>{const r=await fetch(url,{headers:{'Content-Type':'application/json'},credentials:'same-origin',...opts});if(r.status===401){ME=null;renderAuth();throw new Error('Please sign in');}if(!r.ok){const e=await r.json().catch(()=>({error:r.statusText}));throw new Error(e.error||'Request failed');}return r.json();};
let settings={default_barrel_rate:75,default_volume_rate:8,currency:'USD'};
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:settings.currency||'USD'}).format(Number(n)||0);
const flash=(m,err=false)=>{const f=$('#flash');f.textContent=m;f.className='flash show'+(err?' err':'');setTimeout(()=>f.className='flash',2400);};
let ME=null,clients=[];
let BRAND=null,pendingIntent=null;
const isStaff=()=>ME&&ME.user.role==='staff';

/* ================= pricing ================= */
function volumeEach(it){const l=+it.length||0,w=+it.width||0,h=+it.height||0;if(l<=0||w<=0||h<=0)return{v:0,unit:it.dim_unit==='cm'?'CBM':'ft3'};return it.dim_unit==='cm'?{v:(l*w*h)/1e6,unit:'CBM'}:{v:(l*w*h)/1728,unit:'ft3'};}
function priceRow(it){const qty=Math.max(0,Math.min(100,+it.quantity||0));const rate=+it.rate||0;if(it.pricing_mode==='volume'){const{v,unit}=volumeEach(it);return{volume:+v.toFixed(2),unit,charge:+(rate*v*qty).toFixed(2)};}return{volume:0,unit:it.dim_unit==='cm'?'CBM':'ft3',charge:+(rate*qty).toFixed(2)};}

/* ================= boot ================= */
async function boot(){
  try{const r=await api('/api/me');ME=r.user?r:null;}catch(e){ME=null;}
  if(!ME){ try{BRAND=await api('/api/branding');}catch(e){} renderLanding(); return; }
  try{settings=await api('/api/settings');}catch(e){}
  if(isStaff()){try{clients=await api('/api/clients');}catch(e){}}
  renderApp();
  if(pendingIntent){const pi=pendingIntent;pendingIntent=null;go(pi);}
}

/* ================= landing / front page ================= */
function renderLanding(){
  document.body.className='';
  const root=$('#root');root.innerHTML='';
  const b=BRAND||{};
  const name=b.company_name||'Freight CRM';
  const step=(n,h,p)=>el('div',{class:'lp-step'},[el('div',{class:'n'},n),el('h3',{},h),el('p',{},p)]);
  const startSchedule=()=>{pendingIntent='intake';renderAuth('register');};
  const contact=[];
  if(b.company_phone)contact.push('📞 '+b.company_phone);
  if(b.company_email)contact.push('✉ '+b.company_email);
  if(b.company_address)contact.push('📍 '+b.company_address);
  root.append(el('div',{class:'lp'},[
    el('div',{class:'lp-top'},[
      el('div',{class:'lp-brand'},[el('span',{class:'badge'},'NVOCC'),name]),
      el('button',{class:'lp-signin',onclick:()=>renderAuth('login')},'Sign in'),
    ]),
    el('div',{class:'lp-hero'},[
      el('h1',{},'Ship your barrels & boxes — booked in a minute'),
      el('p',{class:'lp-sub'},b.company_tagline||'To the Caribbean & the rest of the world'),
      el('div',{class:'lp-cta'},[
        el('button',{class:'btn primary lp-big',onclick:startSchedule},'📦 Schedule a Pickup'),
        el('button',{class:'lp-ghostbig',onclick:()=>renderAuth('login')},'🔍 Track my shipment'),
      ]),
      el('p',{class:'lp-note'},'New here? Tap “Schedule a Pickup” — set up takes about a minute.'),
    ]),
    el('div',{class:'lp-steps'},[
      step('1','Create your account','A quick sign-up with your name and contact details.'),
      step('2','Schedule your pickup','Choose your pickup date, add your barrels & boxes, and see the price instantly.'),
      step('3','Track, print & go','Get a booking number, a printable invoice, and barcode labels for every piece.'),
    ]),
    contact.length?el('div',{class:'lp-foot'},[el('div',{},contact.join('   ·   ')),el('div',{style:'margin-top:6px;opacity:.7'},'© '+name)]):null,
  ]));
}

/* ================= auth screen ================= */
function renderAuth(mode='login'){
  document.body.className='';
  const root=$('#root');root.innerHTML='';
  const F={};
  const field=(k,label,type='text')=>{const i=el('input',{type,autocomplete:'off'});F[k]=i;return el('div',{style:'margin-bottom:10px'},[el('label',{},label),i]);};
  // Build ONLY the active form so F maps to the inputs actually on screen.
  const body=el('div',{});
  if(mode==='login'){
    body.append(el('div',{},[field('username','Username'),field('password','Password','password'),
      el('button',{class:'btn primary',style:'width:100%;margin-top:6px',onclick:doLogin},'Sign in')]));
  }else{
    body.append(el('div',{},[
